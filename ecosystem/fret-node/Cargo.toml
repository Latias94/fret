[package]
name = "fret-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Node-graph foundation and integration surfaces for Fret editor workflows."

[dependencies]
fret-canvas = { version = "0.1.0", path = "../fret-canvas", optional = true }
fret-app = { version = "0.1.0", path = "../../crates/fret-app", optional = true }
fret-core = { version = "0.1.0", path = "../../crates/fret-core" }
fret-runtime = { version = "0.1.0", path = "../../crates/fret-runtime", optional = true }
fret-ui = { version = "0.1.0", path = "../../crates/fret-ui", optional = true }
fret-ui-kit = { version = "0.1.0", path = "../fret-ui-kit", optional = true, default-features = false, features = ["dnd"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
slotmap.workspace = true

[features]
default = ["fret-ui", "kit"]

# Convention-aligned feature alias:
# - `ui` implies the existing `fret-ui` integration surface.
ui = ["fret-ui"]

# Enables integration helpers for `crates/fret-ui` (canvas widget, action hooks, styling surfaces).
fret-ui = ["dep:fret-ui", "dep:fret-runtime", "dep:fret-canvas", "dep:fret-ui-kit"]

# Opt into the `rstar` spatial index backend for large graphs.
canvas-rstar = ["fret-ui", "fret-canvas/rstar"]

# Convenience surfaces (profiles + common recipes) built on top of the substrate.
#
# This is headless-safe: it must not depend on `fret-ui`.
kit = []

# Optional integration helpers for `fret-app` applications (command registration + default keybindings).
app-integration = ["dep:fret-app"]

# Marker for explicitly documented headless builds.
#
# Cargo features are additive: `--features headless` does not disable the default UI-enabled
# feature set. Use `--no-default-features` (optionally with `--features headless`) for the actual
# headless graph model + schema + rules build with no `fret-ui` dependency.
headless = []

[lints.rust]
dead_code = "allow"

[lints.clippy]
arc_with_non_send_sync = "allow"
default_constructed_unit_structs = "allow"
doc_lazy_continuation = "allow"
field_reassign_with_default = "allow"
map_entry = "allow"
new_without_default = "allow"
ok_expect = "allow"
question_mark = "allow"
redundant_closure = "allow"
reserve_after_initialization = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
