[package]
name = "fret-plot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = []

ui = []
imui = ["ui", "dep:fret-authoring"]
# Legacy no-op feature kept temporarily for downstream transition. The retained plot bridge
# source was deleted after quarantine and no longer enables the unstable retained bridge feature.
compat-retained-canvas = []

[dependencies]
fret-canvas = { path = "../fret-canvas" }
fret-authoring = { path = "../fret-authoring", optional = true }
fret-core = { path = "../../crates/fret-core" }
fret-runtime = { path = "../../crates/fret-runtime" }
fret-ui = { path = "../../crates/fret-ui" }
slotmap.workspace = true
fret-ui-kit = { path = "../fret-ui-kit" }

[lints.clippy]
bool_assert_comparison = "allow"
field_reassign_with_default = "allow"
manual_clamp = "allow"
question_mark = "allow"
reserve_after_initialization = "allow"
too_many_arguments = "allow"
